name: Generate Snake Animation

on:
  schedule:
    - cron: "0 18 * * *"   # Setiap hari jam 01:00 WIB (18:00 UTC)
  workflow_dispatch:         # Bisa dijalankan manual

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rezadesky
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=64B5F6&color_dots[0]=0A0F1E&color_dots[1]=0D2B63&color_dots[2]=0D47A1&color_dots[3]=1565C0&color_dots[4]=42A5F5&color_empty=0D1B2A
            dist/github-contribution-grid-snake-dark.svg?color_snake=90CAF9&color_dots[0]=0A0F1E&color_dots[1]=0D2B63&color_dots[2]=0D47A1&color_dots[3]=1565C0&color_dots[4]=64B5F6&color_empty=0D1B2A

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
