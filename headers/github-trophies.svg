<svg width="500" height="55" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="50%" stop-color="#64B5F6"/>
      <stop offset="100%" stop-color="#0D47A1"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="498" height="53" rx="10" ry="10" fill="url(#g)" stroke="#64B5F6" stroke-width="1" opacity="0.95"/>
  <text x="250" y="35" font-family="Onest, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)" letter-spacing="1">GitHub Trophies</text>
</svg>
