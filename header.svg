<svg width="850" height="130" viewBox="0 0 850 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Elegant Gradient Accent -->
    <linearGradient id="minimal-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 36px;
      fill: #F8FAFC;
      letter-spacing: -0.5px;
      animation: fadeIn 0.8s ease-out;
    }
    .role-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94A3B8;
      letter-spacing: 0.2px;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #34D399;
    }
  </style>

  <!-- Status Badge (Top Left Minimalist Pill) -->
  <g transform="translate(0, 8)">
    <rect width="150" height="24" rx="12" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-opacity="0.3"/>
    <circle cx="16" cy="12" r="3.5" fill="#34D399">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="16" class="status-text">Available for work</text>
  </g>

  <!-- Main Name Title -->
  <g transform="translate(0, 68)">
    <text class="name-title">Reza Saputra Desky</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(0, 96)">
    <text class="role-subtitle">Full-Stack Web Developer — Crafting clean &amp; scalable web experiences</text>
  </g>

  <!-- Subtle Minimalist Bottom Line Accent -->
  <line x1="0" y1="120" x2="850" y2="120" stroke="url(#minimal-line)" stroke-width="1.5" opacity="0.8"/>
</svg>
