<svg width="850" height="120" viewBox="0 0 850 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="light-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 32px;
      fill: #0F172A;
      letter-spacing: -0.5px;
    }
    .role {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #64748B;
    }
    .badge-bg {
      fill: #F0FDF4;
      stroke: #86EFAC;
      stroke-width: 1;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #15803D;
    }
  </style>

  <!-- Status pill -->
  <g transform="translate(0, 10)">
    <rect width="138" height="22" rx="11" class="badge-bg"/>
    <circle cx="14" cy="11" r="3.5" fill="#22C55E"/>
    <text x="25" y="15" class="badge-text">Available for hire</text>
  </g>

  <!-- Title -->
  <g transform="translate(0, 62)">
    <text class="name">Reza Saputra Desky</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(0, 88)">
    <text class="role">Full-Stack Web Developer &middot; Banda Aceh, Indonesia</text>
  </g>

  <!-- Minimal divider -->
  <line x1="0" y1="112" x2="850" y2="112" stroke="url(#divider-grad)" stroke-width="1"/>
</svg>