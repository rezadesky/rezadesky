<svg width="560" height="560" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A1929"/>
    </linearGradient>
  </defs>

  <circle cx="280" cy="280" r="90" fill="url(#coreGlow)">
    <animate attributeName="r" values="85;100;85" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="280" cy="280" r="200" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="2 6" opacity="0.6"/>
  <circle cx="280" cy="280" r="150" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="2 6" opacity="0.6"/>
  <circle cx="280" cy="280" r="100" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="2 6" opacity="0.6"/>

  <circle cx="280" cy="280" r="58" fill="url(#coreFill)" stroke="#3B82F6" stroke-width="2"/>
  <text x="280" y="288" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#64B5F6">RS</text>

  <!-- ring 1 : r=100, 4 nodes, clockwise -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 280 280" to="360 280 280" dur="18s" repeatCount="indefinite"/>
    <g transform="translate(380,280)"><circle r="24" fill="#0F213B" stroke="#3B82F6" stroke-width="1.5"/><text text-anchor="middle" dy="5" font-family="JetBrains Mono, monospace" font-size="12" fill="#93C5FD">JS</text></g>
    <g transform="translate(280,380)"><circle r="24" fill="#0F213B" stroke="#3B82F6" stroke-width="1.5"/><text text-anchor="middle" dy="5" font-family="JetBrains Mono, monospace" font-size="12" fill="#93C5FD">TS</text></g>
    <g transform="translate(180,280)"><circle r="24" fill="#0F213B" stroke="#3B82F6" stroke-width="1.5"/><text text-anchor="middle" dy="5" font-family="JetBrains Mono, monospace" font-size="11" fill="#93C5FD">RE</text></g>
    <g transform="translate(280,180)"><circle r="24" fill="#0F213B" stroke="#3B82F6" stroke-width="1.5"/><text text-anchor="middle" dy="5" font-family="JetBrains Mono, monospace" font-size="11" fill="#93C5FD">NX</text></g>
  </g>

  <!-- ring 2 : r=150, 3 nodes, counter-clockwise -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 280 280" to="0 280 280" dur="26s" repeatCount="indefinite"/>
    <g transform="translate(430,280)"><circle r="26" fill="#0F213B" stroke="#64B5F6" stroke-width="1.5"/><text text-anchor="middle" dy="5" font-family="JetBrains Mono, monospace" font-size="11" fill="#93C5FD">LA</text></g>
    <g transform="translate(205,410)"><circle r="26" fill="#0F213B" stroke="#64B5F6" stroke-width="1.5"/><text text-anchor="middle" dy="5" font-family="JetBrains Mono, monospace" font-size="11" fill="#93C5FD">ND</text></g>
    <g transform="translate(205,150)"><circle r="26" fill="#0F213B" stroke="#64B5F6" stroke-width="1.5"/><text text-anchor="middle" dy="5" font-family="JetBrains Mono, monospace" font-size="10" fill="#93C5FD">SQL</text></g>
  </g>

  <!-- ring 3 : r=200, 2 nodes, clockwise slow -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 280 280" to="360 280 280" dur="34s" repeatCount="indefinite"/>
    <g transform="translate(480,280)"><circle r="22" fill="#0F213B" stroke="#1E3A8A" stroke-width="1.5"/><text text-anchor="middle" dy="4" font-family="JetBrains Mono, monospace" font-size="10" fill="#8892B0">GIT</text></g>
    <g transform="translate(80,280)"><circle r="22" fill="#0F213B" stroke="#1E3A8A" stroke-width="1.5"/><text text-anchor="middle" dy="4" font-family="JetBrains Mono, monospace" font-size="10" fill="#8892B0">PHP</text></g>
  </g>
</svg>
